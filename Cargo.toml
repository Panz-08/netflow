[package]
name = "netflow"
version = "0.2.0"
edition = "2021"
authors = ["Panz-08"]
description = "NetFlow - analisis jalur data di port, tampil sebagai selang dan bola yang bergerak"

[[bin]]
name = "ntf"
path = "src/main.rs"

[features]
default = []
# Tangkap paket sungguhan lewat libpcap (butuh libpcap-dev dan izin capture)
live = ["dep:pcap"]

[dependencies]
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
rand = "0.8"
pcap = { version = "2", optional = true }

[profile.release]
opt-level = 3
lto = true
